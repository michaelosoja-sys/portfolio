<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You — Counting Down</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page-content">
    <section class="section countdown">
      <h2 class="story-heading" style="color: var(--red);">
        <!-- EDIT: what you're counting down to -->
        Counting down to our birthday which is today
      </h2>
      <div class="countdown-grid">
        <div class="countdown-unit"><span class="num" id="cd-days">00</span><span class="label">days</span></div>
        <div class="countdown-unit"><span class="num" id="cd-hours">00</span><span class="label">hours</span></div>
        <div class="countdown-unit"><span class="num" id="cd-mins">00</span><span class="label">minutes</span></div>
        <div class="countdown-unit"><span class="num" id="cd-secs">00</span><span class="label">seconds</span></div>
      </div>
    </section>
  </main>

  <nav class="page-nav" aria-label="Page navigation">
    <a class="nav-link" href="gallery.html">Back</a>
    <div class="page-dots" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>
    <a class="nav-link next" href="closing.html">Continue</a>
  </nav>

  <script>
    // EDIT: set your target date here — format is "Month Day, Year HH:MM:SS"
    const targetDate = new Date("September 26, 2027 00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = Math.max(targetDate - now, 0);

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((distance % (s1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("cd-days").textContent = String(days).padStart(2, "0");
      document.getElementById("cd-hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("cd-mins").textContent = String(mins).padStart(2, "0");
      document.getElementById("cd-secs").textContent = String(secs).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
